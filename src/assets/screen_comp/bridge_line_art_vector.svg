      </feComponentTransfer>
      <feComposite in="soft" in2="tooth" operator="arithmetic" k1="0.9" k2="0.22" k3="0" k4="0" result="grained"/>
      <feComponentTransfer in="grained">
        <feFuncA type="gamma" amplitude="1.55" exponent="0.55"/>
      </feComponentTransfer>
    </filter>
  </defs>
